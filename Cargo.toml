[package]
name = "bili-comment-hub"
version = "1.0.0"
edition = "2021"
description = "把哔哩哔哩创作中心的评论整合导出为 JSON 的桌面工具"

[dependencies]
slint = "1.19.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "gzip"] }
md-5 = "0.10"
urlencoding = "2"
chrono = { version = "0.4", features = ["clock"] }
anyhow = "1"
rfd = "0.15"
dirs = "6"
webbrowser = "1"
qrcode = { version = "0.15.0", default-features = false, features = ["std"] }

tempfile = "3"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
keyring = { version = "=4.2.0", features = ["v1"] }

[build-dependencies]
slint-build = "1.19.0"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
