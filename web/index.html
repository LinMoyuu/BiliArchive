<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>稿件评论 · BiliArchive</title><link rel="stylesheet" href="/assets/workspaces.css"></head><body>
<header class="app-header"><div class="app-brand"><div id="product-icon" class="app-logo">评</div><div class="product-picker"><button id="workspace-toggle" aria-haspopup="menu" aria-controls="workspace-menu" aria-expanded="false"><strong id="product-name">稿件评论</strong><svg class="workspace-chevron" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1 L5 5 L9 1"/></svg></button><span id="product-subtitle">他人在我的稿件下发表的评论</span><div id="workspace-menu" role="menu" hidden><button id="workspace-comments" role="menuitemradio" aria-checked="true" data-workspace="comments"><b>稿件评论</b><small>稿件评论</small><span class="workspace-check">✓</span></button><button id="workspace-messages" role="menuitemradio" aria-checked="false" data-workspace="messages"><b>消息归档</b><small>私信、粉丝团与互动通知</small><span class="workspace-check">✓</span></button></div></div></div>
<div id="comment-header">  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <div class="links">
    <a class="btn" href="/api/comments/posts" target="_blank" rel="noopener">稿件列表</a>
  </div>
</div><div id="message-header" hidden><div id="header-stats" class="stats" aria-label="消息归档统计"></div></div><div class="web-account"><button type="button" class="account-photo" aria-label="放大账号头像" aria-haspopup="dialog"><span id="account-fallback"><svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="10" r="5"/><path d="M5 28v-4a10 10 0 0 1 20 0v4"/></svg><img id="account-default-avatar" src="/assets/noface.jpg" alt="默认头像" referrerpolicy="no-referrer"></span><img id="account-avatar" alt="用户头像" referrerpolicy="no-referrer" hidden></button><button id="account-toggle" aria-haspopup="dialog" aria-controls="account-menu" aria-expanded="false"><span id="account-name">未登录</span><svg class="chevron" viewBox="0 0 10 6" aria-hidden="true"><path d="M0 0h10L5 6Z"/></svg></button><div id="account-menu" role="dialog" aria-label="账号信息" tabindex="-1" hidden><span id="account-uid">请在桌面应用右上角登录</span><span id="account-last-collection" hidden></span></div></div></header>
<main id="comment-workspace" data-workspace="comments" hidden>
  <aside>
    <div class="aside-top">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="搜索稿件标题 / BV 号 / 评论内容" autocomplete="off">
        <button type="button" class="clr" id="qClear" aria-label="清空稿件搜索" title="清空稿件搜索" hidden>×</button>
      </div>
      <div class="chips" id="filters">
        <button class="chip" data-f="all" aria-pressed="true">全部稿件</button>
        <button class="chip" data-f="hidden" aria-pressed="false">已删除 / 仅自己可见</button>
        <button class="chip" data-f="public" aria-pressed="false">公开</button>
      </div>
      <div class="chips" id="typeFilters">
        <button class="chip" data-type="all" aria-pressed="true">所有</button>
        <button class="chip" data-type="video" aria-pressed="false">视频</button>
        <button class="chip" data-type="dynamic" aria-pressed="false">动态</button>
        <button class="chip" data-type="article" aria-pressed="false">专栏</button>
        <button class="chip" data-type="audio" aria-pressed="false">音频</button>
      </div>
      <div class="seg" id="videoSortSeg" role="group" aria-label="稿件排序">
        <button data-video-sort="new" aria-pressed="true">时间倒序</button>
        <button data-video-sort="old" aria-pressed="false">时间正序</button>
        <button data-video-sort="comments" aria-pressed="false">评论最多</button>
        <button data-video-sort="comments-asc" aria-pressed="false">评论最少</button>
      </div>
    </div>
    <div class="loading" id="boot" role="alert"></div>
    <div class="vlist" id="vlist"></div>
  </aside>

  <section>
    <div id="detail" class="detail-head" style="display:none"></div>
    <div class="comment-tools" id="tools" style="display:none">
      <div class="search" id="csearch">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="cq" placeholder="搜评论 / 用户 / 楼中楼" autocomplete="off">
        <button class="clr" id="cqClear" title="清空">×</button>
      </div>
      <span class="seg-label">排序</span>
      <div class="seg" id="sortSeg">
        <button data-sort="like" aria-pressed="true">点赞</button>
        <button data-sort="old" aria-pressed="false">最早</button>
        <button data-sort="new" aria-pressed="false">最新</button>
      </div>
      <label class="switch"><input type="checkbox" id="onlyUp"> 只看 UP 主</label>
      <label class="switch"><input type="checkbox" id="withReplies" checked> 显示楼中楼</label>
      <span class="spacer" style="flex:1"></span>
      <span id="cmtCount" style="color:var(--faint)"></span>
    </div>
    <div class="comments" id="comments"></div>
  </section>
</main>
<main id="message-workspace" data-workspace="messages" hidden><aside><nav id="m-types" aria-label="消息分类"><button data-type="replies" aria-pressed="true">回复我的</button><button data-type="mentions" aria-pressed="false">@我的</button><button data-type="likes" aria-pressed="false">收到的赞</button><button data-type="private" aria-pressed="false">私信</button><button data-type="my_comments" aria-pressed="false">我的评论</button></nav></aside><section>
<div id="m-list-pane"><div class="message-toolbar"><div id="m-grouping" class="tools" role="group" aria-label="消息展示方式"><button data-group="flat" aria-pressed="true">平铺</button><button data-group="user" aria-pressed="false">按用户</button><button data-group="video" aria-pressed="false">按主题</button></div>
<div class="message-toolbar-right"><div id="m-status" class="muted" hidden></div><span id="m-my-comment-note" class="muted" hidden>根据已归档的回复和点赞通知整理，仅包含能从这些通知找到的评论。</span><label class="search"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor"/><path d="M10 10l5 5" stroke="currentColor"/></svg><input id="m-q" aria-label="搜索正文、昵称或 UID" placeholder="搜索正文、昵称或 UID"></label><select id="m-order" aria-label="消息排序"><option value="new">时间倒序</option><option value="old">时间正序</option></select><button id="m-refresh">刷新</button></div></div>
<div id="m-private-body"><div id="m-session-pane" data-archive-scroll-root hidden><div id="m-sessions" aria-label="私信会话" hidden></div></div><div id="m-conversation-pane"><div id="m-error" role="alert"></div><div id="m-items"></div><div id="m-page-error" role="alert"></div><div class="pager"><span id="m-page" class="muted" role="status"></span><button id="m-more">加载更多</button></div><div id="m-sentinel" class="load-sentinel" aria-hidden="true"></div>
<div id="m-chat-view" hidden><div id="m-chat-title" class="chat-title"></div><div id="m-chat-scroll" data-archive-scroll-root tabindex="0" role="log" aria-label="归档会话" aria-live="off"><div class="chat-history"><div id="m-chat-sentinel" class="load-sentinel" aria-hidden="true"></div><span id="m-chat-progress" class="muted"></span><button id="m-chat-more">加载更早消息</button><div id="m-chat-error" role="alert"></div></div><div id="m-chat-messages"></div></div></div>
</div></div></div><div id="m-like-detail" hidden></div></section></main>
<button id="back-to-top" class="back-to-top" aria-label="回到顶部" title="回到顶部" hidden><svg viewBox="0 0 12 8" aria-hidden="true"><path d="M0 8L6 0l6 8Z"/></svg></button>
<dialog id="image-lightbox" aria-labelledby="image-lightbox-title">
  <div class="lightbox-panel">
    <h2 id="image-lightbox-title" class="lightbox-title">图片预览</h2>
    <div class="lightbox-toolbar">
      <a data-image-original target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" hidden>访问原图</a>
      <button type="button" data-lightbox-close aria-label="关闭图片预览" autofocus>×</button>
    </div>
    <div class="lightbox-stage">
      <div class="lightbox-viewport"></div>
      <span class="lightbox-status" role="status" hidden></span>
    </div>
  </div>
</dialog>
<script src="/assets/image-lightbox.js" defer></script><script src="/assets/archive-loading.js" defer></script><script src="/assets/archive-images.js" defer></script><script src="/assets/comments.js" defer></script><script src="/assets/messages.js" defer></script><script src="/assets/account.js" defer></script><script src="/assets/workspaces.js" defer></script></body></html>
