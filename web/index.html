<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- B 站图床按 Referer 防盗链：右键「新开标签页」会丢掉 img 上的 referrerpolicy，
     用页面级 meta 兜底，让整页所有请求（含新开标签页）都不带 Referer -->
<meta name="referrer" content="no-referrer">
<title>评论聚合台 · 全部稿件评论</title>
<style>
  :root{
    --bg:#f5f6fa; --card:#fff; --line:#e8ebf2; --line-soft:#f0f2f7;
    --text:#1c2230; --muted:#6a7285; --faint:#9aa1b2;
    --pink:#fb7299; --pink-dark:#e45c83; --pink-soft:#fff1f5;
    --green:#0f9d76; --green-soft:#e9f8f2;
    --amber:#b26a00; --amber-soft:#fff6e6;
    --red:#d9485f; --red-soft:#ffeff2;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none}
  button{font:inherit}

  /* ---------- 顶栏 ---------- */
  header{
    position:sticky; top:0; z-index:20; height:62px;
    display:flex; align-items:center; gap:18px; padding:0 20px;
    background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px; flex:none}
  .logo{
    width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
    background:linear-gradient(140deg,#ff9dba,#fb7299); color:#fff; font-weight:800; font-size:14px;
    box-shadow:0 4px 10px rgba(251,114,153,.28);
  }
  .brand b{font-size:15px; letter-spacing:.2px}
  .brand span{font-size:11px; color:var(--faint); display:block; line-height:1.2; margin-top:-2px}

  .stats{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .stat{
    display:flex; align-items:baseline; gap:5px; padding:4px 10px; border-radius:999px;
    background:#f4f6fb; color:var(--muted); font-size:11.5px;
  }
  .stat b{color:var(--text); font-size:13px; font-weight:700}
  .stat.warn{background:var(--red-soft); color:var(--red)}
  .stat.warn b{color:var(--red)}

  .spacer{flex:1}
  .links{display:flex; gap:8px; flex:none}
  .btn{
    display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 13px;
    border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--muted);
    font-size:12px; cursor:pointer; transition:.15s;
  }
  .btn:hover{border-color:#d9dfea; color:var(--text); background:#fbfcfe}
  .btn.primary{background:var(--pink); border-color:var(--pink); color:#fff}
  .btn.primary:hover{background:var(--pink-dark); border-color:var(--pink-dark); color:#fff}

  /* ---------- 主体 ---------- */
  main{display:grid; grid-template-columns:352px minmax(0,1fr); height:calc(100vh - 62px)}
  aside{
    border-right:1px solid var(--line); background:var(--card);
    display:flex; flex-direction:column; min-height:0;
  }
  .aside-top{padding:12px 12px 10px; border-bottom:1px solid var(--line-soft); display:flex; flex-direction:column; gap:9px}
  .search{
    position:relative; display:flex; align-items:center;
    background:#f4f6fb; border:1px solid transparent; border-radius:9px; height:34px; padding:0 10px;
  }
  .search:focus-within{background:#fff; border-color:#f7c3d3; box-shadow:0 0 0 3px rgba(251,114,153,.1)}
  .search svg{flex:none; opacity:.5}
  .search input{
    border:0; outline:0; background:transparent; flex:1; min-width:0; margin-left:7px; font:inherit; font-size:12.5px; color:var(--text);
  }
  .search input::placeholder{color:#a8aebe}
  .search kbd{font:11px ui-monospace,monospace; color:var(--faint); border:1px solid var(--line); border-radius:4px; padding:0 4px; background:#fff}
  .chips{display:flex; gap:6px; flex-wrap:wrap}
  .chip{
    height:26px; padding:0 10px; border-radius:999px; border:1px solid var(--line);
    background:#fff; color:var(--muted); font-size:11.5px; cursor:pointer;
  }
  .chip[aria-pressed="true"]{background:var(--pink-soft); border-color:#fbd0dd; color:var(--pink-dark); font-weight:600}

  .vlist{flex:1; overflow:auto; overscroll-behavior:contain}
  .vrow{
    display:grid; grid-template-columns:86px minmax(0,1fr); gap:10px;
    padding:10px 12px; border-bottom:1px solid var(--line-soft); cursor:pointer; position:relative;
  }
  .vrow:hover{background:#fbfcff}
  .vrow.active{background:var(--pink-soft)}
  .vrow.active::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--pink)}
  .thumb{
    width:86px; height:54px; border-radius:7px; background:#eceff6 center/cover no-repeat;
    display:grid; place-items:center; color:#c2c8d6; font-size:17px; font-weight:700; overflow:hidden; flex:none;
  }
  .thumb > a,.detail-cover > a{display:block; width:100%; height:100%; cursor:zoom-in}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .vtitle{font-size:12.5px; line-height:1.4; margin:0 0 4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .vmeta{font-size:11px; color:var(--faint); display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .vmeta .dot{width:3px; height:3px; border-radius:50%; background:#d5dae5}
  .badge{font-size:10px; padding:1px 6px; border-radius:5px; font-weight:600; line-height:15px}
  .badge.deleted{background:var(--red-soft); color:var(--red)}
  .badge.private{background:var(--amber-soft); color:var(--amber)}
  .badge.rejected{background:#f1f2f7; color:#7a8296}
  .st{font-size:11px; font-weight:600}
  .st.public{color:var(--green)}
  .st.private{color:var(--amber)}
  .st.deleted{color:var(--red)}
  .st.rejected{color:var(--muted)}

  /* ---------- 右栏 ---------- */
  section{display:flex; flex-direction:column; min-height:0; min-width:0}
  .detail-head{
    padding:16px 22px; border-bottom:1px solid var(--line); background:var(--card);
    display:flex; gap:14px; align-items:flex-start;
  }
  .detail-cover{width:108px; height:68px; border-radius:9px; background:#eceff6 center/cover no-repeat; flex:none; overflow:hidden; display:grid; place-items:center; color:#c2c8d6; font-weight:700}
  .detail-cover img{width:100%; height:100%; object-fit:cover}
  .detail-main{min-width:0; flex:1}
  .detail-main h1{margin:0 0 6px; font-size:16px; line-height:1.4; font-weight:700}
  .detail-sub{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:11.5px; color:var(--faint)}
  .detail-sub .kv b{color:var(--muted); font-weight:600}
  .head-tools{display:flex; gap:8px; flex:none; align-items:flex-start}
  .badge.k{background:#eef4ff; color:#4a6da8; border-color:#dbe6fb}
  /* 动态正文 */
  .dyn-body{margin-top:10px; padding:11px 13px; background:#f8f9fc; border:1px solid #eef1f7; border-radius:10px}
  .dyn-body .t{white-space:pre-wrap; font-size:13px; line-height:1.75; color:#2c3242; word-break:break-word}
  .dyn-body .pics{margin-top:8px}
  .dyn-body .orig{margin-top:10px; padding:9px 11px; background:#fff; border-left:3px solid #e3e7f0; border-radius:8px; font-size:12.5px; line-height:1.7; color:#4a5164; white-space:pre-wrap}
  .dyn-body .orig .who{color:#5b7fb8; font-weight:600; margin-right:6px}

  .comment-tools{
    display:flex; align-items:center; gap:10px; padding:8px 22px; border-bottom:1px solid var(--line-soft);
    background:#fbfcfe; font-size:12px; color:var(--muted); flex-wrap:wrap;
  }
  .comment-tools .search{height:30px; width:236px; flex:none; background:#fff; border-color:var(--line)}
  .comment-tools .search input{font-size:12px}
  .comment-tools .search .clr{
    border:0; background:transparent; color:var(--faint); cursor:pointer; font-size:14px; line-height:1;
    padding:0 2px; display:none;
  }
  .comment-tools .search.filled .clr{display:block}
  .switch{display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none; white-space:nowrap}
  .switch input{accent-color:var(--pink); margin:0}
  .seg{display:inline-flex; align-items:center; background:#f1f3f8; border:1px solid var(--line); border-radius:8px; padding:2px; gap:2px; flex:none}
  .seg button{
    border:0; background:transparent; border-radius:6px; height:22px; padding:0 9px;
    font-size:11px; color:var(--muted); cursor:pointer; white-space:nowrap;
  }
  .seg button[aria-pressed="true"]{background:#fff; color:var(--pink-dark); font-weight:600; box-shadow:0 1px 2px rgba(16,24,40,.07)}
  .seg-label{font-size:11px; color:var(--faint); flex:none}

  .comments{flex:1; overflow:auto; padding:6px 22px 40px; overscroll-behavior:contain}
  .cmt{display:flex; gap:11px; padding:14px 0; border-bottom:1px solid var(--line-soft)}
  .avatar{
    width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center;
    background:#eef1f7; color:#8b93a6; font-size:13px; font-weight:700; overflow:hidden;
  }
  .avatar img{width:100%; height:100%; object-fit:cover; display:block}
  .avatar a{display:flex; align-items:center; justify-content:center; width:100%; height:100%}
  .avatar.up{background:linear-gradient(140deg,#ffc2d3,#fb7299); color:#fff}
  .avatar.sm{width:22px; height:22px; font-size:10px}
  .cmt-body{min-width:0; flex:1}
  .cmt-top{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:3px}
  .name{font-size:12.5px; color:#4a6ea8; font-weight:600}
  .name:hover{text-decoration:underline}
  .name.up{color:var(--pink-dark)}
  .name.vip{color:var(--pink)}
  .name.vip.up{color:var(--pink-dark)}
  .loc{
    font-size:10px; color:#8d94a6; background:#f3f5fa; border-radius:4px;
    padding:0 5px; line-height:16px; white-space:nowrap;
  }
  .pics{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px}
  .pics a{display:block; width:104px; height:104px; border-radius:8px; overflow:hidden; border:1px solid var(--line); background:#f4f6fb}
  .pics img{width:100%; height:100%; object-fit:cover; display:block}
  .reply .pics a{width:66px; height:66px}
  .lv{font-size:10px; color:var(--faint); border:1px solid var(--line); border-radius:4px; padding:0 3px}
  .t{font-size:11px; color:var(--faint)}
  .pin,.upflag{font-size:10px; padding:0 5px; border-radius:4px; font-weight:600}
  .pin{background:var(--pink-soft); color:var(--pink-dark)}
  .upflag{background:var(--pink); color:#fff}
  .cmt-text{font-size:13px; line-height:1.75; color:#232a38; white-space:pre-wrap; word-break:break-word}
  .cmt-foot{display:flex; align-items:center; gap:14px; margin-top:6px; font-size:11px; color:var(--faint)}
  .cmt-foot .act{display:inline-flex; align-items:center; gap:4px}
  .cmt-foot button{
    border:0; background:transparent; color:var(--faint); cursor:pointer; padding:0; font-size:11px;
  }
  .cmt-foot button:hover{color:var(--pink-dark)}
  /* 灰底块向左右各外扩 12px，让里面的 22px 头像与主评论文本左边缘严格对齐 */
  .replies{margin-top:9px; margin-left:-12px; background:#f8f9fc; border-radius:9px; padding:9px 12px; display:flex; flex-direction:column; gap:9px}
  .reply{display:flex; gap:8px; align-items:flex-start; font-size:12.5px; line-height:1.6; color:#3a4152}
  .reply .rbody{min-width:0; flex:1}
  /* 楼中楼首行与 22px 头像同高并垂直居中，避免头像压线、文字错位 */
  .reply .rtop{display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-height:22px; line-height:1.2}
  .reply .name{font-size:12px; line-height:1.2}
  .reply .t{margin-left:0}
  .more-replies{border:0; background:transparent; color:#5b7fb8; font-size:11.5px; cursor:pointer; text-align:left; padding:0}
  .empty{display:grid; place-items:center; height:100%; color:var(--faint); font-size:12.5px; gap:8px; text-align:center}
  .empty .box{width:52px; height:52px; border-radius:14px; background:#f0f2f8; display:grid; place-items:center; font-size:18px; color:#c3c9d7}
  .loading{padding:60px; text-align:center; color:var(--faint)}
  .sentinel{height:2px}
  .end{text-align:center; color:var(--faint); font-size:11px; padding:18px 0 6px}
  mark{background:#fff2b8; padding:0 1px; border-radius:2px}
  ::-webkit-scrollbar{width:10px; height:10px}
  ::-webkit-scrollbar-thumb{background:#dce1ea; border-radius:6px; border:3px solid transparent; background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#c8cfdb; background-clip:content-box}
  @media (max-width:1080px){
    .comment-tools .search{width:180px}
  }
  @media (max-width:900px){
    main{grid-template-columns:1fr}
    aside{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">评</div>
    <div><b>评论聚合台</b><span>创作中心 · 评论管理</span></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <div class="links">
    <a class="btn" href="/api/data.json" target="_blank" rel="noopener">JSON</a>
    <a class="btn" href="/api/videos" target="_blank" rel="noopener">稿件列表</a>
  </div>
</header>

<main>
  <aside>
    <div class="aside-top">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="搜索稿件标题 / BV 号 / 评论内容" autocomplete="off">
        <kbd>/</kbd>
      </div>
      <div class="chips" id="filters">
        <button class="chip" data-f="all" aria-pressed="true">全部稿件</button>
        <button class="chip" data-f="hidden" aria-pressed="false">已删除 / 仅自己可见</button>
        <button class="chip" data-f="public" aria-pressed="false">公开</button>
      </div>
      <div class="chips" id="typeFilters">
        <button class="chip" data-type="all" aria-pressed="true">所有</button>
        <button class="chip" data-type="video" aria-pressed="false">视频</button>
        <button class="chip" data-type="dynamic" aria-pressed="false">动态</button>
        <button class="chip" data-type="article" aria-pressed="false">专栏</button>
        <button class="chip" data-type="audio" aria-pressed="false">音频</button>
      </div>
      <div class="seg" id="videoSortSeg" role="group" aria-label="稿件时间排序">
        <button data-video-sort="new" aria-pressed="true">时间倒序</button>
        <button data-video-sort="old" aria-pressed="false">时间正序</button>
      </div>
    </div>
    <div class="vlist" id="vlist"></div>
  </aside>

  <section>
    <div id="detail" class="detail-head" style="display:none"></div>
    <div class="comment-tools" id="tools" style="display:none">
      <div class="search" id="csearch">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="cq" placeholder="搜评论 / 用户 / 楼中楼" autocomplete="off">
        <button class="clr" id="cqClear" title="清空">×</button>
      </div>
      <span class="seg-label">排序</span>
      <div class="seg" id="sortSeg">
        <button data-sort="like" aria-pressed="true">点赞</button>
        <button data-sort="old" aria-pressed="false">最早</button>
        <button data-sort="new" aria-pressed="false">最新</button>
      </div>
      <label class="switch"><input type="checkbox" id="onlyUp"> 只看 UP 主</label>
      <label class="switch"><input type="checkbox" id="withReplies" checked> 显示楼中楼</label>
      <span class="spacer" style="flex:1"></span>
      <span id="cmtCount" style="color:var(--faint)"></span>
    </div>
    <div class="comments" id="comments">
      <div class="loading" id="boot">正在加载数据…</div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const PAGE = 30;              // 每批往页面上拼多少条

const state = {
  doc: null,
  key: '',                    // 当前选中的内容：type-aid（动态的 id 和视频 aid 可能撞号）
  filter: 'all',
  type: 'all',                // 左侧内容类型：all | video | dynamic | article | audio
  vq: '',                     // 左侧：稿件搜索
  q: '',                      // 右侧：评论区搜索
  videoSort: 'new',           // 稿件排序，与评论排序独立
  sort: 'like',               // like 点赞（默认）| old 最早 | new 最新
  onlyUp: false,
  withReplies: true,
  shown: 0,
  list: [],                   // 当前稿件过滤 + 排序后的评论
  rendered: 0,
};

const STATUS_BADGE = {deleted:'deleted', private:'private', rejected:'rejected'};
const STATUS_LABEL = {deleted:'已删除', private:'仅自己可见', rejected:'未公开', unknown:''};

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function num(n){return (n||0).toLocaleString('zh-CN');}
function shortNum(n){
  if(n>=10000) return (n/10000).toFixed(1).replace(/\.0$/,'')+' 万';
  return num(n);
}
function hl(text, q){
  const src = String(text||'');
  if(!q) return esc(src);
  const lower = src.toLowerCase(), needle = q.toLowerCase();
  if(!needle) return esc(src);
  let out = '', i = 0;
  while(i <= src.length){
    const p = lower.indexOf(needle, i);
    if(p < 0){ out += esc(src.slice(i)); break; }
    out += esc(src.slice(i, p)) + '<mark>' + esc(src.slice(p, p + needle.length)) + '</mark>';
    i = p + needle.length;
  }
  return out;
}
function spaceURL(mid){
  return mid ? 'https://space.bilibili.com/' + mid : '';
}
function nameHTML(user, extra){
  const name = (user && user.uname) || '?';
  const cls = 'name' + (extra ? ' ' + extra : '') + (user && user.is_vip ? ' vip' : '') + (user && user.is_up ? ' up' : '');
  const url = spaceURL(user && user.mid);
  const inner = esc(name);
  return url
    ? `<a class="${cls}" href="${url}" target="_blank" rel="noopener" title="打开用户主页">${inner}</a>`
    : `<span class="${cls}">${inner}</span>`;
}
function avatarHTML(user, extra){
  const name = (user && user.uname) || '?';
  const src = String((user && user.avatar) || '').replace(/^http:\/\//i, 'https://');
  const cls = 'avatar' + (extra ? ' ' + extra : '') + (user && user.is_up ? ' up' : '');
  const inner = src
    ? `<img src="${esc(src)}" referrerpolicy="no-referrer" loading="lazy" alt="" onerror="this.remove()">`
    : esc(name.slice(0,1));
  const url = spaceURL(user && user.mid);
  return `<div class="${cls}">` + (url
    ? `<a href="${url}" target="_blank" rel="noopener" title="打开用户主页">${inner}</a>`
    : inner) + `</div>`;
}
function picturesHTML(list){
  const arr = (list || []).filter(Boolean);
  if(!arr.length) return '';
  // B 站图床按 Referer 防盗链：带本地地址的 Referer 一律 403，
  // 所以图片本身和「点开原图」的新标签页都必须不带 Referer
  return '<div class="pics">' + arr.map(u =>
    `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer"><img src="${esc(u)}" referrerpolicy="no-referrer" loading="lazy" alt=""></a>`
  ).join('') + '</div>';
}
function locationHTML(user){
  return (user && user.location) ? `<span class="loc">IP属地：${esc(user.location)}</span>` : '';
}

// ---------------- 稿件排序：默认发布日期从新到旧 ----------------
function timeVal(value){
  if(value === null || value === undefined || value === '') return null;
  const text = String(value).trim();
  if(!text) return null;
  if(typeof value === 'number' || /^\d+(?:\.\d+)?$/.test(text)){
    const n = Number(value);
    if(!Number.isFinite(n) || n <= 0) return null;
    const ms = n >= 1e11 ? n : n * 1000;
    return Number.isFinite(new Date(ms).getTime()) ? ms : null;
  }
  let t = Date.parse(text);
  if(!Number.isFinite(t) && /^\d{4}-\d{2}-\d{2} /.test(text)){
    t = Date.parse(text.replace(/-/g, '/'));
  }
  return Number.isFinite(t) ? t : null;
}
function pubMs(v){
  for(const value of [v.publish_time_text, v.publishTime, v.publish_time]){
    const t = timeVal(value);
    if(t !== null) return t;
  }
  return null;
}
// 发布时间缺失时，使用最早评论时间。
function firstCommentTime(v){
  let min = null;
  (v.comments || []).forEach(c=>{
    const t = timeVal(c.ctime_text) ?? timeVal(c.ctime);
    if(t !== null && (min === null || t < min)) min = t;
  });
  return min;
}
function dateKey(v){
  return pubMs(v) ?? firstCommentTime(v);
}
function compareVideoTime(a, b){
  const ka = dateKey(a), kb = dateKey(b);
  if(ka === kb) return 0;
  // 缺少时间始终置后，不随排序方向翻转。
  if(ka === null) return 1;
  if(kb === null) return -1;
  return state.videoSort === 'old' ? ka - kb : kb - ka;
}
function renderVideoSort(){
  document.querySelectorAll('#videoSortSeg button').forEach(button=>{
    button.setAttribute('aria-pressed', String(button.dataset.videoSort === state.videoSort));
    button.onclick = ()=>{
      state.videoSort = button.dataset.videoSort;
      renderVideoSort();
      renderList();
    };
  });
}
function coverHTML(src, fallback){
  if(!src) return `<span>${esc(fallback)}</span>`;
  return `<a data-cover-link href="${esc(src)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" title="打开封面原图"><img src="${esc(src)}" referrerpolicy="no-referrer" loading="lazy" alt=""></a>`;
}

function ymd(ms){
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  // 带年份，否则跨年的列表看起来像乱序
  return String(d.getFullYear()).slice(2) + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function dateLabel(v){
  const p = pubMs(v);
  if(p !== null) return `<span title="发布 ${new Date(p).toLocaleString('zh-CN')}">${ymd(p)}</span>`;
  const f = firstCommentTime(v);
  if(f === null) return '';
  // 没有发布日期就标出「首评」，让人知道这行是按最早评论排的
  return `<span title="无发布时间，按最早一条评论 ${new Date(f).toLocaleString('zh-CN')}">首评 ${ymd(f)}</span>`;
}

// ---------------- 载入 ----------------
fetch('/api/data.json').then(r=>r.json()).then(d=>{
  state.doc = d;
  if(!state.doc.videos) state.doc.videos = [];
  const usp = new URLSearchParams(location.search);
  if(['all','hidden','public'].includes(usp.get('filter'))) state.filter = usp.get('filter');
  if(['all','video','dynamic','article','audio'].includes(usp.get('type'))) state.type = usp.get('type');
  const sortParam = usp.get('sort');
  if(['new','old','like','time'].includes(sortParam)){
    state.sort = sortParam === 'time' ? 'new' : sortParam;   // time 是旧值，按最新处理
  }
  if(usp.get('q')){ state.q = usp.get('q'); $('cq').value = state.q; }
  if(usp.get('vq')){ state.vq = usp.get('vq'); $('q').value = state.vq; }

  renderStats();
  renderFilters();
  renderTypeFilters();
  renderSort();
  renderVideoSort();
  syncSearchBoxes();
  renderList();

  // 选中稿件：?aid=123 或 #123；带了评论区搜索词时，优先落在第一个命中的稿件
  const wantAid = parseInt(usp.get('aid') || '', 10) || 0;
  const wantKey = decodeURIComponent((location.hash || '').replace('#', ''));
  const visible = visibleVideos();
  const hit = visible.find(v=>keyOf(v)===wantKey)
    || (wantAid ? visible.find(v=>v.aid===wantAid) : null)
    || (state.q ? visible.find(v=>videoHitsQuery(v, state.q)) : null)
    || visible[0] || state.doc.videos[0] || {};
  selectVideo(keyOf(hit), { keepScroll: true });
}).catch(e=>{
  $('boot').textContent = '加载失败：' + e.message;
});

// ---------------- 左侧稿件列表 ----------------
function renderStats(){
  const s = state.doc.stats || {};
  const hidden = (state.doc.videos||[]).filter(v=>['deleted','private','rejected'].includes(v.status)).length;
  $('stats').innerHTML = `
    <div class="stat"><b>${num(s.videos||state.doc.videos.length)}</b>个稿件</div>
    <div class="stat"><b>${num(s.comments)}</b>条评论</div>
    <div class="stat"><b>${num(s.replies)}</b>条回复</div>
    ${s.dynamics?`<div class="stat"><b>${num(s.dynamics)}</b>个动态</div>`:''}
    ${hidden ? `<div class="stat warn"><b>${num(hidden)}</b>个已隐藏</div>` : ''}
  `;
}

function videoHitsQuery(v, q){
  const needle = q.toLowerCase();
  if((v.title||'').toLowerCase().includes(needle)) return true;
  if((v.text||'').toLowerCase().includes(needle)) return true;
  if((v.orig_text||'').toLowerCase().includes(needle)) return true;
  if((v.bvid||'').toLowerCase().includes(needle)) return true;
  return (v.comments||[]).some(c =>
    (c.content||'').toLowerCase().includes(needle)
    || (c.uname||'').toLowerCase().includes(needle)
    || (c.replies||[]).some(r =>
      (r.content||'').toLowerCase().includes(needle)
      || (r.uname||'').toLowerCase().includes(needle)));
}

function matchVideo(v){
  if(state.filter==='hidden' && !['deleted','private','rejected'].includes(v.status)) return false;
  if(state.filter==='public' && v.status!=='public') return false;
  // 按内容类型筛选
  if(state.type !== 'all' && typeOf(v) !== state.type) return false;
  if(!state.vq) return true;
  return videoHitsQuery(v, state.vq);
}

function visibleVideos(){
  return (state.doc.videos||[]).filter(matchVideo).sort(compareVideoTime);
}

function renderFilters(){
  document.querySelectorAll('#filters .chip').forEach(b=>{
    b.setAttribute('aria-pressed', String(b.dataset.f===state.filter));
    b.onclick = ()=>{
      state.filter = b.dataset.f;
      renderFilters();
      renderList();
    };
  });
}

function renderTypeFilters(){
  document.querySelectorAll('#typeFilters .chip').forEach(b=>{
    b.setAttribute('aria-pressed', String(b.dataset.type===state.type));
    b.onclick = ()=>{
      state.type = b.dataset.type;
      renderTypeFilters();
      renderList();
    };
  });
}

const TYPE_NAME = {video:'视频', dynamic:'动态', article:'专栏', audio:'音频'};
function keyOf(v){ return (v.type||'video') + '-' + v.aid; }
function typeOf(v){ return v.type || 'video'; }
function isPlainType(v){ const k = typeOf(v); return k==='dynamic'||k==='article'||k==='audio'; }
// 每种内容的官方编号都不一样：动态是 opus id，专栏 cv，音频 au，视频 bvid/av
function idLabel(v){
  switch(typeOf(v)){
    case 'dynamic': return '动态 ID ' + (v.dynamic_id || v.aid);
    case 'article': return 'cv' + v.aid;
    case 'audio':   return 'au' + v.aid;
    default:        return v.bvid || ('av' + v.aid);
  }
}
// 动态没有标题：正文首行当标题，再退到 id
function dynTitle(v){
  const line = (v.text||'').split('\n').map(x=>x.trim()).find(Boolean) || '';
  if(line) return line.length > 80 ? line.slice(0,80)+'…' : line;
  const kindName = TYPE_NAME[typeOf(v)] || '内容';
  return kindName + ' ' + (typeOf(v)==='dynamic' && v.dynamic_id ? v.dynamic_id : v.aid);
}
function findContent(key){
  return (state.doc.videos||[]).find(x=>keyOf(x)===key);
}
function renderList(){
  const list = visibleVideos();
  if(!list.length){
    $('vlist').innerHTML = `<div class="empty" style="height:220px"><div class="box">空</div><div>没有匹配的稿件</div></div>`;
    return;
  }
  $('vlist').innerHTML = list.map(v=>{
    const cnt = (v.comments||[]).length;
    const badge = STATUS_LABEL[v.status] ? `<span class="badge ${STATUS_BADGE[v.status]}">${STATUS_LABEL[v.status]}</span>` : '';
    const KN = TYPE_NAME[typeOf(v)] || TYPE_NAME.video;
    const typeBadge = isPlainType(v) ? `<span class="badge k">${KN}</span>` : '';
    const coverSrc = v.cover || (v.type==='dynamic' && (v.text_pics||[])[0]) || '';
    const cover = coverHTML(coverSrc, KN[0]);
    const dl = dateLabel(v);
    const rowTitle = v.title || (isPlainType(v) ? dynTitle(v) : ('av'+v.aid));
    return `<div class="vrow${keyOf(v)===state.key?' active':''}" data-key="${keyOf(v)}">
      <div class="thumb">${cover}</div>
      <div style="min-width:0">
        <p class="vtitle">${hl(rowTitle, state.vq)}</p>
        <div class="vmeta">
          ${typeBadge}
          ${badge}
          ${dl}
          <span>抓取 ${num(cnt)}</span>
          ${v.comment_total && v.status!=='deleted'?`<span class="dot"></span><span>官方 ${shortNum(v.comment_total)}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
  $('vlist').querySelectorAll('.vrow').forEach(el=>{
    el.onclick = e=>{
      if(e.target.closest('[data-cover-link]')) return;
      selectVideo(el.dataset.key);
    };
  });
  // 当前选中的稿件被筛掉了，就自动切到列表里的第一个
  if(!list.some(v=>keyOf(v)===state.key)) selectVideo(keyOf(list[0]), {keepScroll:true});
}

// ---------------- 右栏 ----------------
function selectVideo(key, opts){
  if(!key) return;
  state.key = key;
  state.shown = 0;
  state.rendered = 0;
  history.replaceState(null,'','#'+encodeURIComponent(key));
  const v = findContent(key);
  if(!v) return;
  const type = typeOf(v);
  const KN = TYPE_NAME[type] || TYPE_NAME.video;
  const plain = isPlainType(v);
  const dyn = type === 'dynamic';
  const badge = STATUS_LABEL[v.status] ? `<span class="badge ${STATUS_BADGE[v.status]}">${STATUS_LABEL[v.status]}</span>` : '';
  const typeBadge = plain ? `<span class="badge k">${KN}</span>` : '';
  const coverSrc = v.cover || (dyn && (v.text_pics||[])[0]) || '';
  const cover = coverHTML(coverSrc, KN[0]);
  const cmts = (v.comments||[]);
  const replies = cmts.reduce((n,c)=>n+((c.replies||[]).length),0);
  const title = plain ? (v.title || dynTitle(v)) : (v.title||('av'+v.aid));
  const sub = [];
  sub.push(`<span class="kv">${esc(idLabel(v))}</span>`);
  if(v.publish_time_text) sub.push(`<span class="kv">发布 <b>${esc(v.publish_time_text)}</b></span>`);
  if(v.ip_location) sub.push(`<span class="loc">IP属地：${esc(v.ip_location)}</span>`);
  if(dyn){
    if(v.like_count) sub.push(`<span class="kv">赞 <b>${num(v.like_count)}</b></span>`);
    if(v.forward_count) sub.push(`<span class="kv">转发 <b>${num(v.forward_count)}</b></span>`);
  }
  sub.push(`<span class="kv">抓取 <b>${num(cmts.length)}</b> 条评论 · <b>${num(replies)}</b> 条回复</span>`);
  if(v.comment_total && v.status!=='deleted') sub.push(`<span class="kv">官方计数 <b>${num(v.comment_total)}</b></span>`);
  if(v.status_text && !STATUS_LABEL[v.status]) sub.push(`<span class="st ${esc(v.status)}">${esc(v.status_text)}</span>`);
  const body = (dyn || (plain && (v.text||v.orig_text))) ? `<div class="dyn-body">
      <div class="t">${esc(v.text||'（这条内容没有文字）')}</div>
      ${(v.text_pics||[]).length?picturesHTML(v.text_pics):''}
      ${v.orig_text?`<div class="orig"><span class="who">@${esc(v.orig_author||'原作者')}</span>${esc(v.orig_text)}</div>`:''}
    </div>` : '';
  const openLabel = '打开' + KN;
  const openLink = (v.status==='deleted' || !v.url) ? ''
    : `<a class="btn" href="${esc(v.url)}" target="_blank" rel="noopener">${openLabel}</a>`;
  $('detail').style.display = 'flex';
  $('detail').innerHTML = `
    <div class="detail-cover">${cover}</div>
    <div class="detail-main">
      <h1>${esc(title)} ${typeBadge} ${badge}</h1>
      <div class="detail-sub">${sub.join('')}</div>
      ${body}
    </div>
    <div class="head-tools">
      ${openLink}
      <a class="btn" href="/api/video?aid=${v.aid}" target="_blank" rel="noopener">本条 JSON</a>
    </div>`;
  $('tools').style.display = 'flex';
  [...$('vlist').querySelectorAll('.vrow')].forEach(el=>{
    el.classList.toggle('active', el.dataset.key===state.key);
  });
  if(!opts || !opts.keepScroll){
    $('vlist').querySelector('.vrow.active')?.scrollIntoView({block:'nearest'});
  }
  resetComments();
}

function commentMatches(c, q){
  if(!q) return true;
  const needle = q.toLowerCase();
  if((c.content||'').toLowerCase().includes(needle)) return true;
  if((c.uname||'').toLowerCase().includes(needle)) return true;
  return (c.replies||[]).some(r =>
    (r.content||'').toLowerCase().includes(needle)
    || (r.uname||'').toLowerCase().includes(needle));
}

function commentList(){
  const v = findContent(state.key);
  if(!v) return [];
  let list = (v.comments||[]).filter(c=>commentMatches(c, state.q));
  if(state.onlyUp) list = list.filter(c=>c.is_up);
  const byNew = (a,b)=> (b.ctime||0) - (a.ctime||0);   // 新 → 旧
  const byOld = (a,b)=> (a.ctime||0) - (b.ctime||0);   // 旧 → 新
  const timeCmp = state.sort === 'old' ? byOld : byNew;
  list.sort((a,b)=>{
    if(a.is_pinned !== b.is_pinned) return a.is_pinned ? -1 : 1;   // 置顶恒定在最前
    if(state.sort === 'like') return (b.like||0) - (a.like||0) || byNew(a,b);
    return timeCmp(a,b);
  });
  return list;
}

function resetComments(){
  state.list = commentList();
  state.rendered = 0;
  const box = $('comments');
  if(!state.list.length){
    $('cmtCount').textContent = '0 条';
    box.innerHTML = `<div class="empty" style="height:300px"><div class="box">💬</div><div>${state.q?'没有匹配的评论':'这个稿件还没有抓到评论'}</div></div>`;
    return;
  }
  box.innerHTML = '';
  appendComments();
}

// 往页面上追加一批评论（滚动到底自动触发）
function appendComments(){
  const box = $('comments');
  if(state.rendered >= state.list.length) return;
  const from = state.rendered;
  const to = Math.min(from + PAGE, state.list.length);
  const html = state.list.slice(from, to)
    .map(c=>commentHTML(c, state.q, state.withReplies))
    .join('');
  const footer = box.querySelector('.end');
  if(footer) footer.remove();
  box.insertAdjacentHTML('beforeend', html);
  state.rendered = to;
  $('cmtCount').textContent = `${num(state.list.length)} 条 · 已显示 ${num(state.rendered)}`;
  if(state.rendered < state.list.length){
    box.insertAdjacentHTML('beforeend', '<div class="end">向下滚动自动加载更多…</div>');
  } else {
    box.insertAdjacentHTML('beforeend', `<div class="end">已全部加载 · 共 ${num(state.list.length)} 条</div>`);
  }
  // 首屏没撑满（或窗口很高）时继续补，保证滚动条出现
  if(box.scrollHeight <= box.clientHeight + 40 && state.rendered < state.list.length){
    appendComments();
  }
}

function replyHTML(r, q){
  const top = `<div class="rtop">${nameHTML(r)}${r.is_up?'<span class="upflag">UP</span>':''}<span class="t">${esc(r.ctime_text)}</span>${locationHTML(r)}</div>`;
  return `<div class="reply">${avatarHTML(r,'sm')}<div class="rbody">${top}<div class="rtext">${hl(r.content,q)}</div>${picturesHTML(r.pictures)}</div></div>`;
}

function commentHTML(c, q, withReplies){
  const reps = c.replies||[];
  // 搜索时展示所有命中的楼中楼，不折叠
  const shown = q ? reps.filter(r => commentMatches(r, q)) : reps;
  const limit = q ? shown.length : 3;
  const repHTML = withReplies && shown.length ? `<div class="replies">${
      shown.slice(0,limit).map(r=>replyHTML(r,q)).join('')
    }${shown.length>limit?`<button class="more-replies" data-open="${c.rpid}">展开其余 ${shown.length-limit} 条回复</button>`:''}</div>` : '';
  return `<div class="cmt" data-rpid="${c.rpid}">
    ${avatarHTML(c)}
    <div class="cmt-body">
      <div class="cmt-top">
        ${nameHTML(c)}
        ${c.is_up?'<span class="upflag">UP</span>':''}
        ${c.level?`<span class="lv">LV${c.level}</span>`:''}
        ${c.is_pinned?'<span class="pin">置顶</span>':''}
        ${locationHTML(c)}
        <span class="t">${esc(c.ctime_text)}</span>
      </div>
      ${c.content?`<div class="cmt-text">${hl(c.content, q)}</div>`:''}
      ${picturesHTML(c.pictures)}
      <div class="cmt-foot">
        <span class="act">👍 ${num(c.like)}</span>
        ${reps.length?`<span class="act">💬 ${num(Math.max(reps.length, c.reply_count||0))}</span>`:''}
      </div>
      ${repHTML}
    </div>
  </div>`;
}

// 展开楼中楼：追加到已渲染的节点上（不重排整页，滚动位置不跳）
$('comments').addEventListener('click', e=>{
  const btn = e.target.closest('[data-open]');
  if(!btn) return;
  const c = state.list.find(x=>String(x.rpid)===btn.dataset.open);
  if(!c) return;
  const wrap = btn.closest('.replies');
  const reps = state.q ? (c.replies||[]).filter(r=>commentMatches(r, state.q)) : (c.replies||[]);
  wrap.innerHTML = reps.map(r=>replyHTML(r, state.q)).join('');
});

// 滚动到底部自动拼接下一批
let ticking = false;
$('comments').addEventListener('scroll', ()=>{
  if(ticking) return;
  ticking = true;
  requestAnimationFrame(()=>{
    ticking = false;
    const box = $('comments');
    if(box.scrollTop + box.clientHeight >= box.scrollHeight - 320){
      appendComments();
    }
  });
}, {passive:true});

function renderSort(){
  document.querySelectorAll('#sortSeg button').forEach(b=>{
    b.setAttribute('aria-pressed', String(b.dataset.sort===state.sort));
    b.onclick = ()=>{
      state.sort = b.dataset.sort;
      renderSort();
      resetComments();
      $('comments').scrollTop = 0;
    };
  });
}

function syncSearchBoxes(){
  $('q').value = state.vq;
  $('cq').value = state.q;
  $('csearch').classList.toggle('filled', !!state.q);
}

// ---------------- 交互 ----------------
let timer = null;
$('q').oninput = e => {
  clearTimeout(timer);
  timer = setTimeout(()=>{
    state.vq = e.target.value.trim();
    renderList();
  }, 160);
};

let ctimer = null;
$('cq').oninput = e => {
  $('csearch').classList.toggle('filled', !!e.target.value);
  clearTimeout(ctimer);
  ctimer = setTimeout(()=>{
    state.q = e.target.value.trim();
    resetComments();
    $('comments').scrollTop = 0;
  }, 160);
};
$('cqClear').onclick = ()=>{
  $('cq').value = '';
  state.q = '';
  $('csearch').classList.remove('filled');
  resetComments();
};

$('onlyUp').onchange = e => { state.onlyUp = e.target.checked; resetComments(); };
$('withReplies').onchange = e => { state.withReplies = e.target.checked; resetComments(); };

document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==$('q') && document.activeElement!==$('cq')){
    e.preventDefault(); $('q').focus();
  }
  if(e.key==='Escape' && (document.activeElement===$('q') || document.activeElement===$('cq'))){
    document.activeElement.blur();
  }
});
</script>
</body>
